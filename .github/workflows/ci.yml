name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Next.js app (typecheck, 175 tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  legacy:
    name: Streamlit prototype (50 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: legacy/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest
